services:
  - type: web
    name: bipbom
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: PROVIDER_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
